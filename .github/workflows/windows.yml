# בונה התקנה ל-Windows (breslever-pro-setup.exe) ומוסיף אותה לאותו עמוד הורדות של הגרסה – אחרי שבניית ה-APK הסתיימה
name: Build Windows
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: גרסה
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
      - name: בנייה
        shell: bash
        run: |
          cp -r www desktop/app
          cd desktop
          npm install --no-audit --no-fund
          npm version "${{ steps.ver.outputs.v }}" --no-git-tag-version --allow-same-version
          npx electron-builder --win --x64 --publish never
          ls dist
      - name: פרסום בעמוד ההורדות
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: |
            desktop/dist/breslever-pro-setup.exe
            desktop/dist/breslever-pro-setup.exe.blockmap
            desktop/dist/latest.yml
