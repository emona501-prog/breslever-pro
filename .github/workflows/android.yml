# בונה APK חתום של ברסלב PRO ומפרסם אותו בעמוד ההורדות (Releases).
# רץ בכל העלאה לענף main, או בלחיצה ידנית (Actions ← Build APK ← Run workflow).
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: בדיקת מפתח החתימה
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "::notice::KEYSTORE_PASS length=${#KEYSTORE_PASS} · KEYSTORE_B64 length=${#KEYSTORE_B64}"
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::חסר הסוד KEYSTORE_PASS"; exit 1; fi
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::חסר הסוד KEYSTORE_B64"; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_B64 לא הועתק במלואו (פענוח נכשל)"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$(printf '%s' "$KEYSTORE_PASS" | tr -d ' \r\n\t')" >/dev/null || { echo "::error::הסיסמה KEYSTORE_PASS לא מתאימה למפתח"; exit 1; }
          P="$(printf '%s' "$KEYSTORE_PASS" | tr -d ' \r\n\t')"; echo "::add-mask::$P"; echo "KS_PASS=$P" >> "$GITHUB_ENV"
          echo "::notice::מפתח החתימה תקין"
      - run: npm ci || npm install
      - run: npx cap sync android
      - name: גרסה
        id: ver
        run: echo "v=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"
      - name: בניית APK חתום
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ env.KS_PASS }}
          VERSION_NAME: ${{ steps.ver.outputs.v }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { M=$(grep -E "error|Error|FAILURE|What went wrong|wrong:|> " "$RUNNER_TEMP/gradle.log" | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=gradle::$M"; exit 1; }
      - name: שם הקובץ
        run: cp android/app/build/outputs/apk/release/app-release.apk breslever-pro.apk
      - name: פרסום בעמוד ההורדות
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: ברסלב PRO ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          files: breslever-pro.apk
          make_latest: true
