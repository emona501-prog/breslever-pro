# פרסום גרסת הדפדפן (אייפון / כל טלפון) ב-GitHub Pages – כל עדכון של www עולה אוטומטית לענף gh-pages
name: Web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          force_orphan: true
